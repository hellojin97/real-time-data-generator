name: kafka-it
# 실브로커 통합 테스트: docker compose 로 Kafka 를 띄우고, 생성기가 produce 한
# 이벤트를 consumer 로 다시 받아 검증한다(produce -> consume 왕복).
on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/kafka-it.yml
  push:
    branches: [ main ]
    paths:
      - src/**
      - tests/**
      - docker-compose.yml
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  kafka-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Install deps (runtime + kafka extra + dev)
        run: uv sync --extra kafka --dev

      - name: Start Kafka (docker compose)
        run: docker compose up -d

      - name: Wait for broker ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T kafka \
                /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "broker ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::broker not ready in time"
          docker compose logs kafka
          exit 1

      - name: Integration test (produce -> consume roundtrip)
        env:
          RUN_KAFKA_IT: "1"
          KAFKA_BOOTSTRAP: localhost:9092
        run: uv run pytest tests/integration -q

      - name: Kafka logs (on failure)
        if: failure()
        run: docker compose logs kafka

      - name: Teardown
        if: always()
        run: docker compose down -v
