name: kafka-it
# 실브로커 통합 테스트: docker compose 로 Kafka 를 띄우고, 생성기가 produce 한
# 이벤트를 consumer 로 다시 받아 검증한다(produce -> consume 왕복).
# 또한 demo 스텝에서 실제 중개 데이터(토픽별 건수 + 레코드 샘플)를 로그로 보여준다.
# workflow_dispatch 로 수동 실행 가능(Actions 탭 또는 API).
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - src/**
      - tests/**
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/kafka-it.yml
  push:
    branches: [ main ]
    paths:
      - src/**
      - tests/**
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/kafka-it.yml

permissions:
  contents: read

jobs:
  kafka-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Install deps (runtime + kafka extra + dev)
        run: uv sync --extra kafka --dev

      - name: Start Kafka (docker compose)
        run: docker compose up -d

      - name: Wait for broker ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T kafka \
                /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "broker ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::broker not ready in time"
          docker compose logs kafka
          exit 1

      - name: Demo — produce via generator, then read back from broker (visible)
        run: |
          echo "================ PRODUCE: generator -> Kafka ================"
          uv run stream-data --sink kafka --simulated --seed 7 \
            --max-events 1500 --conversion-rate 0.3
          echo
          echo "================ TOPIC MESSAGE COUNTS (broker) ============="
          for t in ecom.events ecom.orders ecom.payments; do
            n=$(docker compose exec -T kafka /opt/kafka/bin/kafka-get-offsets.sh \
                  --bootstrap-server localhost:9092 --topic "$t" 2>/dev/null \
                  | awk -F: '{s+=$3} END{print s+0}')
            printf "  %-13s %s messages\n" "$t" "$n"
          done
          echo
          for t in ecom.events ecom.orders ecom.payments; do
            echo "================ SAMPLE FROM $t  (key | value) ============"
            docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server localhost:9092 --topic "$t" --from-beginning \
              --property print.key=true --property key.separator='  |  ' \
              --max-messages 3 --timeout-ms 10000 || true
            echo
          done

      - name: Integration test (produce -> consume roundtrip + fidelity)
        env:
          RUN_KAFKA_IT: "1"
          KAFKA_BOOTSTRAP: localhost:9092
        run: uv run pytest tests/integration -v

      - name: Kafka logs (on failure)
        if: failure()
        run: docker compose logs kafka

      - name: Teardown
        if: always()
        run: docker compose down -v

      - name: Notify Slack (result)
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 시크릿 미설정이면 조용히 건너뛴다(포크 PR 등). 알림 실패가 빌드를 깨지 않도록 비치명적.
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "SLACK_BOT_TOKEN/SLACK_CHANNEL_ID 미설정 — Slack 알림 건너뜀"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then EMOJI="✅"; COLOR="#36a64f"; else EMOJI="❌"; COLOR="#e01e5a"; fi
          TEXT="$EMOJI kafka-it *$JOB_STATUS* — \`$REPO\`@\`${SHA:0:7}\` ($REF)"
          PAYLOAD=$(jq -n \
            --arg ch "$SLACK_CHANNEL_ID" --arg color "$COLOR" --arg text "$TEXT" --arg url "$RUN_URL" \
            '{channel:$ch, text:$text, attachments:[{color:$color, blocks:[
               {type:"section", text:{type:"mrkdwn", text:$text}},
               {type:"context", elements:[{type:"mrkdwn", text:("<"+$url+"|▶ run logs>")}]}
             ]}]}')
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD")
          if echo "$RESP" | jq -e '.ok' >/dev/null; then
            echo "Slack 알림 완료"
          else
            # 비치명적: 토큰/채널 문제는 경고로만 남기고 빌드는 유지
            echo "::warning::Slack 전송 실패: $(echo "$RESP" | jq -r '.error // .')"
          fi
