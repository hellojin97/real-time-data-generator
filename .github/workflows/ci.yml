name: ci
on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
  push:
    branches: [ main ]
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (runtime + dev + parquet extra)
        # parquet extra 포함: load_parquet 회귀 테스트(sibling 스키마)까지 실제 실행
        run: uv sync --dev --extra parquet

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest
