name: kafka-it
# 실브로커 통합 테스트: docker compose 로 Kafka 를 띄우고, 생성기가 produce 한
# 이벤트를 consumer 로 다시 받아 검증한다(produce -> consume 왕복).
# 또한 demo 스텝에서 실제 중개 데이터(토픽별 건수 + 레코드 샘플)를 로그로 보여준다.
# workflow_dispatch 로 수동 실행 가능(Actions 탭 또는 API).
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - src/**
      - tests/**
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/kafka-it.yml
  push:
    branches: [ main ]
    paths:
      - src/**
      - tests/**
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/kafka-it.yml

permissions:
  contents: read
  pull-requests: read   # Slack 스레드에 머지된 PR 내용을 싣기 위해 PR 조회

jobs:
  kafka-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Install deps (runtime + kafka extra + dev)
        run: uv sync --extra kafka --dev

      - name: Start Kafka (docker compose)
        run: docker compose up -d

      - name: Wait for broker ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T kafka \
                /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "broker ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::broker not ready in time"
          docker compose logs kafka
          exit 1

      - name: Demo — produce via generator, then read back from broker (visible)
        run: |
          echo "================ PRODUCE: generator -> Kafka ================"
          uv run stream-data --sink kafka --simulated --seed 7 \
            --max-events 1500 --conversion-rate 0.3
          echo
          echo "================ TOPIC MESSAGE COUNTS (broker) ============="
          for t in ecom.events ecom.orders ecom.payments; do
            n=$(docker compose exec -T kafka /opt/kafka/bin/kafka-get-offsets.sh \
                  --bootstrap-server localhost:9092 --topic "$t" 2>/dev/null \
                  | awk -F: '{s+=$3} END{print s+0}')
            printf "  %-13s %s messages\n" "$t" "$n"
          done
          echo
          for t in ecom.events ecom.orders ecom.payments; do
            echo "================ SAMPLE FROM $t  (key | value) ============"
            docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
              --bootstrap-server localhost:9092 --topic "$t" --from-beginning \
              --property print.key=true --property key.separator='  |  ' \
              --max-messages 3 --timeout-ms 10000 || true
            echo
          done

      - name: Integration test (produce -> consume roundtrip + fidelity)
        env:
          RUN_KAFKA_IT: "1"
          KAFKA_BOOTSTRAP: localhost:9092
        run: uv run pytest tests/integration -v

      - name: Kafka logs (on failure)
        if: failure()
        run: docker compose logs kafka

      - name: Teardown
        if: always()
        run: docker compose down -v

      - name: Build Slack messages
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NL=$'\n'
          case "$JOB_STATUS" in
            success)   TITLE="✅ kafka-it 통과 (produce→consume 검증)"; COLOR="#2ecc71" ;;
            failure)   TITLE="🔴 kafka-it 실패"; COLOR="#e74c3c" ;;
            cancelled) TITLE="⚪ kafka-it 취소됨"; COLOR="#95a5a6" ;;
            *)         TITLE="❓ kafka-it - unknown status"; COLOR="#7f8c8d" ;;
          esac

          # 레포명을 맨 위에 넣어 출처 구분(토큰을 여러 repo가 공유해도 OK)
          HEAD="*${REPO}*${NL}${TITLE}"
          TEXT="*검증*: 실브로커 Kafka produce→consume 충실도${NL}<${RUN_URL}|▶ Job 로그>"
          CTX="브랜치 \`${REF}\` · 실행자 ${ACTOR} · run #${RUN_NUMBER} · \`${COMMIT_SHA:0:7}\`"

          # 메인 메시지(chat.postMessage용; channel 포함)
          jq -n --arg ch "$CHANNEL_ID" --arg color "$COLOR" --arg head "$HEAD" \
                --arg text "$TEXT" --arg ctx "$CTX" --arg fb "$TITLE" \
            '{channel:$ch, text:$fb, attachments:[{color:$color,blocks:[
               {type:"section",text:{type:"mrkdwn",text:$head}},
               {type:"section",text:{type:"mrkdwn",text:$text}},
               {type:"context",elements:[{type:"mrkdwn",text:$ctx}]}
             ]}]}' > slack_main.json

          # 스레드 본문: PR(이벤트 또는 머지 커밋)이면 PR 제목/본문, 아니면 커밋 메시지
          PR_NUMBER="$PR_NUMBER_EVENT"
          if [ -z "$PR_NUMBER" ] && [ -n "$COMMIT_MSG" ]; then
            PR_NUMBER=$(printf '%s' "$COMMIT_MSG" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          fi
          if [ -n "$PR_NUMBER" ]; then
            PR_JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" || echo '{}')
            PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
            PR_BODY=$(printf '%s' "$PR_JSON" | jq -r '.body // ""')
            THREAD_HEAD="📦 *PR* <${SERVER_URL}/${REPO}/pull/${PR_NUMBER}|#${PR_NUMBER}: ${PR_TITLE}>"
            THREAD_BODY="$PR_BODY"
            [ -z "$THREAD_BODY" ] && THREAD_BODY="(PR 본문 없음)"
          else
            THREAD_HEAD="📝 *커밋* \`${COMMIT_SHA:0:7}\` by ${ACTOR}"
            THREAD_BODY="$COMMIT_MSG"
            [ -z "$THREAD_BODY" ] && THREAD_BODY="(커밋 메시지 없음 — 수동 실행)"
          fi

          # 본문은 jq에서 UTF-8 안전하게 1800자로 절단
          jq -n --arg ch "$CHANNEL_ID" --arg head "$THREAD_HEAD" --arg body "$THREAD_BODY" \
            '{channel:$ch, text: ($head + "\n\n" + (if ($body|length) > 1800 then ($body[0:1800] + "…") else $body end))}' \
            > slack_thread_body.json

      - name: Post Slack (main + thread reply)
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN 미설정 — Slack 알림을 건너뜁니다."
            exit 0
          fi
          api() {
            curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @"$1"
          }
          # 1) 메인 상태 메시지 → ts 획득
          RESP=$(api slack_main.json)
          if [ "$(printf '%s' "$RESP" | jq -r '.ok')" != "true" ]; then
            echo "Slack 메인 메시지 실패: $RESP"; exit 1
          fi
          TS=$(printf '%s' "$RESP" | jq -r '.ts')
          echo "메인 메시지 ts=$TS"
          # 2) 그 ts 스레드에 PR/커밋 내용을 답글로
          jq --arg ts "$TS" '. + {thread_ts:$ts}' slack_thread_body.json > slack_thread.json
          RESP2=$(api slack_thread.json)
          if [ "$(printf '%s' "$RESP2" | jq -r '.ok')" != "true" ]; then
            echo "Slack 스레드 답글 실패: $RESP2"; exit 1
          fi
          echo "Slack 알림 완료 (스레드 댓글 포함)"
